<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none" stroke="#2C3E2D" stroke-linecap="round" stroke-linejoin="round">
  <!-- Style for hatching and line weights -->
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2C3E2D" stroke-width="0.8" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- ==========================================
       SOUTH INDIAN UNCLE (TIFFIN & KAAPI MASTER)
       Authentic hand-drawn line-art aesthetic
       ========================================== -->

  <!-- SHOULDER YOKE POLE (Bamboo / Wooden pole across shoulders) -->
  <path d="M 30 220 Q 250 195 470 230" stroke-width="7" stroke="#2C3E2D"/>
  <path d="M 32 225 Q 250 200 468 235" stroke-width="3" stroke="#B85A1F" opacity="0.6"/>
  <!-- Pole wrapping ties -->
  <line x1="120" y1="205" x2="125" y2="216" stroke-width="3"/>
  <line x1="126" y1="204" x2="131" y2="215" stroke-width="3"/>
  <line x1="370" y1="210" x2="375" y2="221" stroke-width="3"/>
  <line x1="376" y1="209" x2="381" y2="220" stroke-width="3"/>

  <!-- Left Hanging Ropes & Tiffin Basket -->
  <path d="M 50 220 L 40 380" stroke-width="2.5"/>
  <path d="M 70 220 L 80 380" stroke-width="2.5"/>
  <path d="M 60 220 L 60 380" stroke-width="2"/>
  <!-- Left Woven Basket / Carrier -->
  <ellipse cx="60" cy="380" rx="35" ry="12" stroke-width="3" fill="#FBF8F2"/>
  <path d="M 25 380 Q 25 460 60 470 Q 95 460 95 380" stroke-width="3" fill="#FBF8F2"/>
  <!-- Basket Woven Hatch Lines -->
  <path d="M 30 400 Q 60 415 90 400" stroke-width="1.8"/>
  <path d="M 32 420 Q 60 435 88 420" stroke-width="1.8"/>
  <path d="M 38 440 Q 60 452 82 440" stroke-width="1.8"/>
  <line x1="45" y1="385" x2="40" y2="455" stroke-width="1.5"/>
  <line x1="60" y1="390" x2="60" y2="465" stroke-width="1.5"/>
  <line x1="75" y1="385" x2="80" y2="455" stroke-width="1.5"/>
  <!-- Steaming Idly Pots inside basket -->
  <ellipse cx="60" cy="370" rx="28" ry="8" stroke-width="2.5" fill="#ffffff"/>
  <ellipse cx="60" cy="360" rx="26" ry="7" stroke-width="2.2" fill="#ffffff"/>
  <!-- Soft steam curls from pot -->
  <path d="M 50 350 Q 42 335 52 320 Q 62 305 55 290" stroke-width="1.8" stroke="#E08A2E" opacity="0.65"/>
  <path d="M 65 348 Q 75 330 67 315 Q 59 300 68 285" stroke-width="1.8" stroke="#E08A2E" opacity="0.65"/>

  <!-- Right Hanging Ropes & Kaapi Davarah Tier -->
  <path d="M 430 228 L 415 390" stroke-width="2.5"/>
  <path d="M 455 230 L 470 390" stroke-width="2.5"/>
  <path d="M 442 229 L 442 390" stroke-width="2"/>
  <!-- Right Basket -->
  <ellipse cx="442" cy="390" rx="36" ry="12" stroke-width="3" fill="#FBF8F2"/>
  <path d="M 406 390 Q 406 470 442 480 Q 478 470 478 390" stroke-width="3" fill="#FBF8F2"/>
  <path d="M 412 410 Q 442 425 472 410" stroke-width="1.8"/>
  <path d="M 415 430 Q 442 445 469 430" stroke-width="1.8"/>
  <path d="M 422 450 Q 442 462 462 450" stroke-width="1.8"/>
  <line x1="425" y1="395" x2="422" y2="465" stroke-width="1.5"/>
  <line x1="442" y1="400" x2="442" y2="475" stroke-width="1.5"/>
  <line x1="459" y1="395" x2="462" y2="465" stroke-width="1.5"/>
  <!-- Traditional Brass Kettle inside right basket -->
  <path d="M 430 355 L 454 355 L 458 385 L 426 385 Z" stroke-width="2.5" fill="#F6C358" opacity="0.4"/>
  <path d="M 426 365 Q 412 360 416 375 L 426 380" stroke-width="2.5"/>
  <path d="M 434 355 Q 442 342 450 355" stroke-width="2.5"/>

  <!-- ==========================================
       UNCLE CHARACTER (Head, Face, Clothes)
       ========================================== -->

  <!-- Head Outline -->
  <path d="M 215 130 C 215 80, 285 80, 285 130 C 288 165, 275 195, 250 198 C 225 195, 212 165, 215 130 Z" stroke-width="3.2" fill="#FBF8F2"/>

  <!-- Hair / Cropped South Indian Hairstyle -->
  <path d="M 212 120 C 210 90, 230 65, 252 64 C 275 64, 290 85, 288 120 C 280 95, 270 85, 250 85 C 230 85, 220 98, 212 120 Z" stroke-width="3" fill="#2C3E2D"/>
  <path d="M 285 110 C 293 118, 293 132, 285 140" stroke-width="2.5"/> <!-- Right Ear -->
  <path d="M 215 110 C 207 118, 207 132, 215 140" stroke-width="2.5"/> <!-- Left Ear -->

  <!-- Forehead Sacred Vibhuti & Tilak (South Indian Cultural Identity) -->
  <line x1="236" y1="98" x2="264" y2="98" stroke-width="2.5" stroke="#2C3E2D"/>
  <line x1="238" y1="102" x2="262" y2="102" stroke-width="2" stroke="#2C3E2D"/>
  <circle cx="250" cy="106" r="2.5" fill="#B85A1F" stroke="none"/> <!-- Kumkum Dot -->

  <!-- Eyebrows -->
  <path d="M 230 115 Q 238 111 245 114" stroke-width="2.8"/>
  <path d="M 255 114 Q 262 111 270 115" stroke-width="2.8"/>

  <!-- Spectacles / Friendly Glasses -->
  <circle cx="238" cy="126" r="9" stroke-width="2.5" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="262" cy="126" r="9" stroke-width="2.5" fill="#ffffff" fill-opacity="0.8"/>
  <line x1="247" y1="126" x2="253" y2="126" stroke-width="2.5"/>
  <line x1="229" y1="124" x2="216" y2="122" stroke-width="2"/>
  <line x1="271" y1="124" x2="284" y2="122" stroke-width="2"/>

  <!-- Smiling Eyes behind glasses -->
  <path d="M 233 126 Q 238 122 243 126" stroke-width="2.2"/>
  <path d="M 257 126 Q 262 122 267 126" stroke-width="2.2"/>

  <!-- Nose -->
  <path d="M 250 126 L 250 142 Q 246 145 243 143" stroke-width="2.2"/>

  <!-- South Indian Classic Mustache (Curved, dignified) -->
  <path d="M 233 154 Q 242 148 250 152 Q 258 148 267 154 Q 275 158 274 163 Q 266 160 250 162 Q 234 160 226 163 Q 225 158 233 154 Z" stroke-width="2" fill="#2C3E2D"/>

  <!-- Warm Smile -->
  <path d="M 240 167 Q 250 176 260 167" stroke-width="2.5"/>

  <!-- Neck -->
  <path d="M 236 195 L 234 218" stroke-width="3"/>
  <path d="M 264 195 L 266 218" stroke-width="3"/>

  <!-- ==========================================
       TORSO & TRADITIONAL ATTIRE
       ========================================== -->

  <!-- Shoulders & Cotton Kurta / Shirt -->
  <path d="M 234 218 C 190 225, 140 240, 130 290 L 135 440 L 365 440 L 370 290 C 360 240, 310 225, 266 218 Z" stroke-width="3.2" fill="#FBF8F2"/>

  <!-- Collar / Placket -->
  <path d="M 238 218 L 244 310 L 256 310 L 262 218" stroke-width="2.5" fill="#ffffff"/>
  <circle cx="250" cy="245" r="2.5" fill="#2C3E2D"/>
  <circle cx="250" cy="270" r="2.5" fill="#2C3E2D"/>
  <circle cx="250" cy="295" r="2.5" fill="#2C3E2D"/>

  <!-- ANGAVASTRAM / THUNDU (Traditional shoulder towel draped over left shoulder) -->
  <path d="M 195 220 Q 185 300 180 390 L 210 395 Q 215 300 225 220 Z" stroke-width="2.8" fill="#ffffff"/>
  <!-- Gold Border Kasavu Stripe on Towel -->
  <line x1="182" y1="375" x2="208" y2="380" stroke-width="4" stroke="#F6C358"/>
  <line x1="181" y1="383" x2="209" y2="388" stroke-width="2" stroke="#B85A1F"/>

  <!-- Left Arm holding the shoulder yoke pole -->
  <path d="M 140 250 Q 105 280 115 320 Q 125 340 135 320 L 145 260" stroke-width="3" fill="#FBF8F2"/>
  <!-- Uncle's Left Hand wrapped around pole -->
  <path d="M 115 210 Q 110 225 125 228 Q 135 225 130 205" stroke-width="2.8" fill="#FBF8F2"/>

  <!-- Right Arm holding the pole with authority -->
  <path d="M 360 250 Q 395 280 385 320 Q 375 340 365 320 L 355 260" stroke-width="3" fill="#FBF8F2"/>
  <!-- Uncle's Right Hand on pole -->
  <path d="M 365 210 Q 360 225 375 228 Q 385 225 380 205" stroke-width="2.8" fill="#FBF8F2"/>

  <!-- TRADITIONAL VESHTI / DHOTI (Waist down) -->
  <path d="M 145 440 L 140 640 L 245 640 L 248 440 Z" stroke-width="3" fill="#ffffff"/>
  <path d="M 252 440 L 255 640 L 360 640 L 355 440 Z" stroke-width="3" fill="#ffffff"/>

  <!-- Veshti Gold Zari Border at hem -->
  <line x1="140" y1="620" x2="245" y2="620" stroke-width="5" stroke="#F6C358"/>
  <line x1="140" y1="628" x2="245" y2="628" stroke-width="2" stroke="#B85A1F"/>
  <line x1="255" y1="620" x2="360" y2="620" stroke-width="5" stroke="#F6C358"/>
  <line x1="255" y1="628" x2="360" y2="628" stroke-width="2" stroke="#B85A1F"/>

  <!-- Veshti Central Pleats (Kozhuppu) -->
  <line x1="250" y1="440" x2="250" y2="620" stroke-width="2.5"/>
  <line x1="245" y1="455" x2="245" y2="600" stroke-width="1.8"/>
  <line x1="255" y1="455" x2="255" y2="600" stroke-width="1.8"/>

  <!-- Subtle fabric folds / shadow hatching -->
  <line x1="155" y1="480" x2="175" y2="520" stroke-width="1.5" stroke="#2C3E2D" opacity="0.4"/>
  <line x1="160" y1="540" x2="185" y2="580" stroke-width="1.5" stroke="#2C3E2D" opacity="0.4"/>
  <line x1="340" y1="480" x2="320" y2="520" stroke-width="1.5" stroke="#2C3E2D" opacity="0.4"/>
  <line x1="335" y1="540" x2="310" y2="580" stroke-width="1.5" stroke="#2C3E2D" opacity="0.4"/>

  <!-- Feet with traditional South Indian Kolhapuri / Leather sandals -->
  <ellipse cx="195" cy="655" rx="22" ry="7" stroke-width="2.8" fill="#FBF8F2"/>
  <path d="M 180 655 Q 195 645 210 655" stroke-width="2.5" stroke="#3A1F14"/>
  <ellipse cx="305" cy="655" rx="22" ry="7" stroke-width="2.8" fill="#FBF8F2"/>
  <path d="M 290 655 Q 305 645 320 655" stroke-width="2.5" stroke="#3A1F14"/>

  <!-- Ground Line & Sketch Dots -->
  <path d="M 80 665 Q 250 670 420 665" stroke-width="2" stroke="#2C3E2D" stroke-dasharray="8 6" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" fill="none" stroke="#2C3E2D" stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="none">
  <!-- Foliage, Coconut Palms & South Indian Temple Gopuram Line-Art Sketch -->
  <!-- Background wash for torn paper reveal -->
  <rect width="1440" height="220" fill="#F2EBE2" opacity="0.6"/>

  <!-- Left Side: Coconut Palms & Banana Foliage -->
  <!-- Palm 1 -->
  <path d="M 60 220 Q 80 140 120 70" stroke-width="3" stroke="#2C3E2D"/>
  <!-- Fronds -->
  <path d="M 120 70 Q 70 50 30 75" stroke-width="2.2" stroke="#2C3E2D"/>
  <path d="M 120 70 Q 100 20 60 30" stroke-width="2.2" stroke="#2C3E2D"/>
  <path d="M 120 70 Q 140 15 150 40" stroke-width="2.2" stroke="#2C3E2D"/>
  <path d="M 120 70 Q 170 50 185 80" stroke-width="2.2" stroke="#2C3E2D"/>
  <path d="M 120 70 Q 110 80 80 100" stroke-width="2.2" stroke="#2C3E2D"/>

  <!-- Palm 2 -->
  <path d="M 170 220 Q 190 130 180 50" stroke-width="3.5" stroke="#2C3E2D"/>
  <path d="M 180 50 Q 130 30 90 55" stroke-width="2.5" stroke="#2C3E2D"/>
  <path d="M 180 50 Q 170 0 130 15" stroke-width="2.5" stroke="#2C3E2D"/>
  <path d="M 180 50 Q 210 -5 220 25" stroke-width="2.5" stroke="#2C3E2D"/>
  <path d="M 180 50 Q 240 30 255 65" stroke-width="2.5" stroke="#2C3E2D"/>
  <path d="M 180 50 Q 200 80 170 100" stroke-width="2.2" stroke="#2C3E2D"/>

  <!-- Broad Banana Leaves Sketch -->
  <path d="M 230 220 Q 250 150 280 120" stroke-width="3"/>
  <path d="M 280 120 C 250 100, 290 80, 320 100 C 350 120, 310 140, 280 120 Z" stroke-width="2" fill="#2C3E2D" fill-opacity="0.08"/>
  <path d="M 210 220 Q 220 170 200 130" stroke-width="2.5"/>
  <path d="M 200 130 C 170 110, 210 90, 240 110 C 270 130, 230 150, 200 130 Z" stroke-width="1.8" fill="#2C3E2D" fill-opacity="0.08"/>

  <!-- Center-Left: Traditional South Indian Temple Gopuram (Tower) Sketch -->
  <g opacity="0.85">
    <!-- Kalasam Spire on Top -->
    <path d="M 450 30 L 450 10 L 452 5 L 454 10 L 454 30" stroke-width="2" fill="#F6C358" fill-opacity="0.5"/>
    <path d="M 442 30 L 462 30 L 458 45 L 446 45 Z" stroke-width="2"/>
    <!-- Tier 1 -->
    <path d="M 438 45 L 466 45 L 472 70 L 432 70 Z" stroke-width="2"/>
    <line x1="444" y1="58" x2="460" y2="58" stroke-width="1.5"/>
    <!-- Tier 2 -->
    <path d="M 428 70 L 476 70 L 484 105 L 420 105 Z" stroke-width="2"/>
    <rect x="444" y="80" width="16" height="20" rx="3" stroke-width="1.5"/>
    <!-- Tier 3 -->
    <path d="M 414 105 L 490 105 L 500 145 L 404 145 Z" stroke-width="2.2"/>
    <rect x="435" y="118" width="14" height="22" rx="3" stroke-width="1.5"/>
    <rect x="455" y="118" width="14" height="22" rx="3" stroke-width="1.5"/>
    <!-- Base Gate (Dwaram) -->
    <path d="M 395 145 L 509 145 L 518 220 L 386 220 Z" stroke-width="2.5"/>
    <!-- Arched Portal -->
    <path d="M 432 220 L 432 170 C 432 155, 472 155, 472 170 L 472 220" stroke-width="2.5" fill="#2C3E2D" fill-opacity="0.15"/>
    <!-- Gopuram Shading Hatch -->
    <line x1="400" y1="160" x2="425" y2="160" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="479" y1="160" x2="505" y2="160" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Center Street Trees & Architectural Portico -->
  <path d="M 590 220 L 590 120 L 720 120 L 720 220" stroke-width="2.2"/>
  <path d="M 580 120 L 730 120 L 655 80 Z" stroke-width="2.5"/>
  <line x1="615" y1="140" x2="615" y2="220" stroke-width="2"/>
  <line x1="655" y1="140" x2="655" y2="220" stroke-width="2"/>
  <line x1="695" y1="140" x2="695" y2="220" stroke-width="2"/>

  <!-- Center Right: Dubai Al Karama Classic Low-Rise Arcade -->
  <g opacity="0.75">
    <path d="M 780 220 L 780 130 L 980 130 L 980 220" stroke-width="2.2"/>
    <!-- Decorative balcony arches -->
    <path d="M 800 170 Q 825 150 850 170 L 850 220 L 800 220 Z" stroke-width="1.8"/>
    <path d="M 865 170 Q 890 150 915 170 L 915 220 L 865 220 Z" stroke-width="1.8"/>
    <path d="M 930 170 Q 955 150 980 170 L 980 220 L 930 220 Z" stroke-width="1.8"/>
    <!-- Cornice -->
    <line x1="770" y1="130" x2="990" y2="130" stroke-width="3"/>
    <line x1="775" y1="120" x2="985" y2="120" stroke-width="1.8"/>
  </g>

  <!-- Right Side: Coconut Grove & Birds -->
  <!-- Palm 3 -->
  <path d="M 1120 220 Q 1100 130 1130 60" stroke-width="3.5" stroke="#2C3E2D"/>
  <path d="M 1130 60 Q 1070 40 1030 65" stroke-width="2.2"/>
  <path d="M 1130 60 Q 1110 10 1070 25" stroke-width="2.2"/>
  <path d="M 1130 60 Q 1150 5 1165 30" stroke-width="2.2"/>
  <path d="M 1130 60 Q 1190 45 1205 75" stroke-width="2.2"/>
  <!-- Palm 4 -->
  <path d="M 1250 220 Q 1230 140 1260 80" stroke-width="3" stroke="#2C3E2D"/>
  <path d="M 1260 80 Q 1210 65 1180 85" stroke-width="2"/>
  <path d="M 1260 80 Q 1245 35 1220 50" stroke-width="2"/>
  <path d="M 1260 80 Q 1285 30 1300 55" stroke-width="2"/>
  <path d="M 1260 80 Q 1320 65 1335 95" stroke-width="2"/>

  <!-- Distant Birds in Sky -->
  <path d="M 330 50 Q 340 40 350 50 Q 360 40 370 50" stroke-width="1.8"/>
  <path d="M 740 40 Q 748 32 756 40 Q 764 32 772 40" stroke-width="1.5"/>
  <path d="M 1000 60 Q 1008 52 1016 60 Q 1024 52 1032 60" stroke-width="1.5"/>
</svg>
